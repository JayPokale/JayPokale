<svg xmlns="http://www.w3.org/2000/svg" width="886" height="268" viewBox="-3 -3 886 268" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Inter','Noto Sans',Helvetica,Arial,sans-serif" xml:space="preserve" role="img" aria-label="Chisle, my project: makes AI coding agents talk less, build less, read less and say more. 1,287 GitHub stars, 4,355 npm downloads a month, 13 agents. Same prompt, output tokens: Chisle 515, caveman 667, ponytail 672, no ruleset 1081. Answers 43% shorter, oversized tool output cut 48%, 156 of 156 answers still correct.">
